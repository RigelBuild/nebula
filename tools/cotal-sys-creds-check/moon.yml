# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: "tool"
language: "go"
tags: ["go"]

tasks:
  test:
    command: "go"
    args: ["test", "./..."]
    env:
      CGO_ENABLED: "0"
    # main.go embeds contract.json, so the test task must track it.
    inputs: ["**/*.go", "go.mod", "go.sum", "**/testdata/**/*", "contract.json"]
