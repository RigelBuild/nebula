# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Tasks run from this project's directory, which is the fork tree root.
# The v3 module is the one this fork ships; go -C selects it without options.cwd.
layer: 'application'
language: 'go'

tasks:
  test:
    command: 'go'
    args: ['-C', 'v3', 'test', './...']
    options:
      cache: false
      # Skipped in CI: needs cgo, pkg-config and GTK/WebKitGTK dev libs, which the nebula devshell lacks. RIG-10145: https://linear.app/rigelbuild/issue/RIG-10145
      runInCI: false
