# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Tasks run from this project's directory, which is the fork tree root.
# The devshell has cargo, but not the Nix C++ headers or bindgen that nix-bindings needs. CI skips these tasks until those are added.
layer: 'application'
language: 'rust'
tasks:
  build:
    command: cargo
    args: ['build']
    options:
      # Blocker: nix-bindings needs Nix C++ headers and bindgen. The devshell has neither.
      runInCI: false
  test:
    command: cargo
    args: ['test']
    options:
      cache: false
      # Same blocker as build: nix-bindings needs Nix C++ headers and bindgen.
      runInCI: false
