# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Cotal is a pnpm TypeScript monorepo; the root package.json owns the build, typecheck, test and docs-bundle scripts.
language: 'typescript'
tags: ['typescript']

tasks:
  install:
    command: 'pnpm'
    args: ['install', '--frozen-lockfile']
    inputs:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
    options:
      runInCI: true
  build:
    command: 'pnpm'
    args: ['build']
    deps:
      - 'install'
    inputs:
      - 'packages/**/*'
      - 'extensions/**/*'
      - 'implementations/**/*'
      - 'examples/**/*'
      - 'bin/**/*'
      - 'desktop/**/*'
      - 'tools/docs-content/**/*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
    options:
      runInCI: true
  typecheck:
    command: 'pnpm'
    args: ['-r', 'typecheck']
    deps:
      - 'build'
    inputs:
      - 'packages/**/*'
      - 'extensions/**/*'
      - 'implementations/**/*'
      - 'examples/**/*'
      - 'bin/**/*'
      - 'desktop/**/*'
      - 'tools/docs-content/**/*'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
    options:
      runInCI: true
  test:
    command: 'pnpm'
    args: ['-r', '--if-present', 'test']
    deps:
      - 'build'
    inputs:
      - 'packages/**/*'
      - 'extensions/**/*'
      - 'implementations/**/*'
      - 'examples/**/*'
      - 'bin/**/*'
      - 'desktop/**/*'
      - 'tools/docs-content/**/*'
      - 'scripts/**/*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
    options:
      runInCI: true
  website-install:
    command: 'npm'
    args: ['--prefix', 'website', 'ci', '--ignore-scripts', '--no-audit', '--no-fund']
    inputs:
      - 'website/package.json'
      - 'website/package-lock.json'
    options:
      runInCI: true
  check-docsbundle:
    command: 'pnpm'
    args: ['check:docsbundle']
    deps:
      - 'build'
      - 'website-install'
    inputs:
      - 'packages/**/*'
      - 'extensions/**/*'
      - 'implementations/**/*'
      - 'examples/**/*'
      - 'bin/**/*'
      - 'desktop/**/*'
      - 'tools/docs-content/**/*'
      - 'docs/**/*'
      - 'spec/**/*'
      - 'scripts/**/*'
      - 'skills/**/*'
      - 'website/**/*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'typedoc.json'
      - 'README.md'
      - 'SPEC.md'
      - 'llms.txt'
    options:
      cache: false
      runInCI: true
