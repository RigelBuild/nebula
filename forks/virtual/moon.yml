# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Tasks run from this project's directory, which is the fork tree root.
layer: 'application'
language: 'typescript'
tasks:
  install:
    command: pnpm
    args: ['install', '--frozen-lockfile']
    inputs:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  build:
    command: pnpm
    args: ['run', 'build:all']
    deps:
      - install
  test:
    command: pnpm
    args: ['run', 'test:ci']
    deps:
      - install
    options:
      cache: false
  lint:
    command: pnpm
    args: ['run', 'test:eslint']
    deps:
      - install
    options:
      cache: false
