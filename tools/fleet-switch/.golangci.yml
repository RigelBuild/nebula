version: "2"

linters:
  default: all
  disable:
    - mnd
    # The Go standard library's short local names and blank-line style are retained.
    - varnamelen
    - wsl
    - wsl_v5
    - cyclop
    - gocognit
    - gocyclo
    - maintidx
    - funlen
    - dupl
    - goconst
    # This API is frozen by the design contract; interface-count heuristics do not apply.
    - ireturn
    # Default rules reject imports of this module's required internal text package.
    - depguard
    # Use the v2 replacement for the deprecated legacy linter.
    - gomodguard
    - nlreturn
    - exhaustruct
  settings:
    gomoddirectives:
      replace-local: true
  enable:
    - gomodguard_v2
  exclusions:
    rules:
      - path: '_test\.go'
        linters:
          - gochecknoglobals
          - paralleltest
          - testpackage
          - funlen
          - goconst
          - dupl
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
