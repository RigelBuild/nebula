# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: "tool"
language: "go"
tags: ["go"]

tasks:
  test:
    command: "nix"
    args: ["develop", "../..#transcript-archive", "--command", "go", "test", "./..."]
    options:
      cache: false
      # Enters the .#transcript-archive devShell, which provides restic for the tests.
      # The root devShell lacks it.
      runInCI: true
    env:
      CGO_ENABLED: "0"
    inputs: ["**/*.go", "go.mod", "go.sum", "**/testdata/**/*", "**/*.cue"]
