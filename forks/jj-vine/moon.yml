# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Tasks run from this project's directory, which is the fork tree root.
layer: 'application'
language: 'rust'
tasks:
  build:
    command: 'cargo'
    args: ['build', '--locked']
    options:
      cache: false
      runInCI: true
  test:
    command: 'cargo'
    args: ['test', '--locked', '--features', 'no-e2e-tests']
    options:
      cache: false
      runInCI: true
  fmt:
    command: 'cargo'
    args: ['fmt', '--check']
    options:
      cache: false
      # Deliberately off: rust-toolchain.toml pins nightly-2026-08-21 for rustfmt. The nebula devshell has stable 1.99 only, and the fork's own CI covers fmt.
      runInCI: false
  clippy:
    command: 'cargo'
    args: ['clippy', '--tests']
    options:
      cache: false
      # Deliberately off: rust-toolchain.toml pins nightly-2026-08-21 for clippy. The nebula devshell has stable 1.99 only, and the fork's own CI covers clippy.
      runInCI: false
