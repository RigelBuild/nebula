language: typescript
tasks:
  install:
    command: bun install --frozen-lockfile
    inputs:
      - package.json
      - bun.lock
  typecheck:
    command: bun run typecheck
    deps:
      - install
    inputs:
      - src/**/*
      - test/**/*
      - scripts/**/*
      - build.ts
      - package.json
      - bun.lock
      - tsconfig.json
      - tsconfig.build.json
      - "/tools/tsconfig/base.json"
  build:
    command: bun run build
    deps:
      - install
    inputs:
      - src/**/*
      - build.ts
      - scripts/**/*
      - package.json
      - bun.lock
      - tsconfig.json
      - tsconfig.build.json
      - "/tools/tsconfig/base.json"
  test:
    command: bun run test
    deps:
      - install
    inputs:
      - src/**/*
      - test/**/*
      - scripts/**/*
      - package.json
      - bun.lock
      - bunfig.toml
      - tsconfig.json
      - "/tools/tsconfig/base.json"
  lint:
    command: bun run lint
    deps:
      - install
    inputs:
      - src/**/*
      - test/**/*
      - scripts/**/*
      - biome.json
      - package.json
      - tsconfig.json
      - .gitignore
