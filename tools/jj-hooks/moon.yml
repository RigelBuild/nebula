# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Tasks run from this project's directory, which is the crate root.
layer: "tool"
language: "rust"
tags: ["rust"]
tasks:
  build:
    command: "cargo"
    args: ["build", "--locked"]
    options:
      cache: false
      # Root devshell has cargo. runInCI stays false: moon ci does not run this task.
      runInCI: false
  test:
    command: "cargo"
    args: ["nextest", "run", "--locked", "--no-fail-fast"]
    options:
      cache: false
      # Root devshell provides the hook backends (pre-commit, prek, lefthook, hk, pkl) the suite drives. CD runs this task.
      runInCI: false
  lint:
    command: "cargo"
    args: ["clippy", "--all-targets", "--", "-D", "warnings"]
    options:
      cache: false
      # Root devshell has cargo. runInCI stays false: moon ci does not run this task.
      runInCI: false
  fmt:
    command: "cargo"
    args: ["fmt", "--check"]
    options:
      cache: false
      # Root devshell has cargo. runInCI stays false: moon ci does not run this task.
      runInCI: false
