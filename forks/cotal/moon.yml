# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Cotal is a pnpm TypeScript monorepo; the root package.json owns the build and typecheck scripts.
language: 'typescript'
tags: ['typescript']

tasks:
  install:
    command: 'pnpm'
    args: ['install', '--frozen-lockfile']
    inputs:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
    options:
      # nebula devshell has no pnpm or node (only go, bun, moon, rumdl, biome); CI cannot run pnpm. See RIG-10145.
      runInCI: false
  build:
    command: 'pnpm'
    args: ['build']
    deps:
      - 'install'
    inputs:
      - 'packages/**/*'
      - 'extensions/**/*'
      - 'implementations/**/*'
      - 'examples/**/*'
      - 'bin/**/*'
      - 'desktop/**/*'
      - 'tools/docs-content/**/*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
    options:
      # nebula devshell has no pnpm or node (only go, bun, moon, rumdl, biome); CI cannot run pnpm. See RIG-10145.
      runInCI: false
  typecheck:
    command: 'pnpm'
    args: ['-r', 'typecheck']
    deps:
      - 'build'
    inputs:
      - 'packages/**/*'
      - 'extensions/**/*'
      - 'implementations/**/*'
      - 'examples/**/*'
      - 'bin/**/*'
      - 'desktop/**/*'
      - 'tools/docs-content/**/*'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
    options:
      # nebula devshell has no pnpm or node (only go, bun, moon, rumdl, biome); CI cannot run pnpm. See RIG-10145.
      runInCI: false
