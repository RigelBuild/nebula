# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: "tool"
language: "go"
tags: ["go"]

tasks:
  test:
    command: "nix"
    args: ["develop", "../..#host-bao-seal", "--command", "go", "test", "./..."]
    env:
      CGO_ENABLED: "0"
    inputs: ["**/*.go", "go.mod", "go.sum", "**/testdata/**/*"]
    options:
      cache: false
      # Enters the .#host-bao-seal devShell, which provides sops and age for the round-trip test.
      # The root devShell lacks them.
      runInCI: true
