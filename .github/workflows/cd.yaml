name: CD

# The file name stays fixed: the release tag uses github.run_number, which
# resets if this file is renamed.
on:
  push:
    branches: [main]
    paths-ignore: [release-manifest.json]

# One CD run at a time; GitHub keeps one pending run, so the next run batches
# every merge that landed meanwhile.
concurrency:
  group: nebula-cd
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
      tag: ${{ steps.plan.outputs.tag }}
      runtime: ${{ steps.plan.outputs.runtime }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - name: Plan the batch
        id: plan
        env:
          CGO_ENABLED: '0'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          go -C tools/cd build -o "$RUNNER_TEMP/cd" .
          "$RUNNER_TEMP/cd" plan -out "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          echo "projects=$(jq -r '.projects | join(" ")' "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          # The runtime builds when forks/cotal changed, or when the previous Release has no runtime asset.
          runtime=false
          if jq -e '.projects | index("forks/cotal")' "$RUNNER_TEMP/plan.json" > /dev/null; then
            runtime=true
          elif [ -z "$(jq -r '.previousTag // empty' "$RUNNER_TEMP/plan.json")" ]; then
            runtime=true
          else
            runtime_assets=$(gh release view "$(jq -r .previousTag "$RUNNER_TEMP/plan.json")" --json assets --jq '[.assets[].name | select(startswith("cotal-runtime-"))] | length')
            if [ "$runtime_assets" = 0 ]; then runtime=true; fi
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          # The release tag is fixed here so the images job and the release job share it.
          echo "tag=nebula-$(date -u +%Y%m%d)-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          # An image whose project has no moon.yml is never planned after the first
          # Release: its changes are not seen and it has no test.
          jq -r '.images[] | "\(.name) \(.project)"' "$RUNNER_TEMP/plan.json" | while read -r name project; do
            if [ ! -f "$project/moon.yml" ]; then
              echo "::warning::image $name: $project has no moon.yml, so CD never rebuilds or tests it"
            fi
          done
      - name: Upload plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plan
          path: ${{ runner.temp }}/plan.json

  batch:
    name: Batch (${{ matrix.system }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - system: aarch64-darwin
            runner: macos-latest
            goos: darwin
            goarch: arm64
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Repository variables. An unset variable leaves its setting empty.
      NIX_CACHE_SUBSTITUTER: ${{ vars.NIX_CACHE_SUBSTITUTER }}
      NIX_CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.NIX_CACHE_SUBSTITUTER }}
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{ env.NIX_CACHE_PUBLIC_KEY }}
            connect-timeout = 5
            fallback = true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: true
      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: plan
          path: ${{ runner.temp }}
      - name: Test planned projects
        # A red project is held: it keeps its previous asset and joins the held list.
        env:
          PROJECTS: ${{ needs.plan.outputs.projects }}
          SYSTEM: ${{ matrix.system }}
        run: |
          mkdir -p "$RUNNER_TEMP/held"
          : > "$RUNNER_TEMP/held/${{ matrix.system }}"
          # One eval per job: the devShell names for this system. Kept apart from jq
          # so a failed eval exits under bash -e (the step has no pipefail).
          shells_json=$(nix eval --json ".#devShells.${{ matrix.system }}" --apply builtins.attrNames)
          shells=$(jq -r '.[]' <<<"$shells_json")
          for project in $PROJECTS; do
            id=$(basename "$project")
            # A project whose planned binaries all name other systems is not tested on this leg.
            # A project with no planned binaries is not gated here, so it keeps its test.
            on_leg=$(jq -r --arg p "$project" --arg s "$SYSTEM" '
              [.binaries[] | select(.project == $p)] as $bins
              | if ($bins | length) == 0 then "yes"
                elif any($bins[]; ((.systems // []) | length == 0) or ((.systems // []) | index($s))) then "yes"
                else "no" end' "$RUNNER_TEMP/plan.json")
            if [ "$on_leg" = no ]; then echo "$project does not target $SYSTEM; not tested here"; continue; fi
            # A project with its own devShell (named after the project) enters it; others use default.
            shell=default
            if grep -Fqx "$id" <<<"$shells"; then shell=$id; fi
            # Only moon's unknown_task means "no tests". Any other moon or devshell
            # error fails the job rather than releasing an untested project.
            if ! out=$(nix develop ".#$shell" --command moon task "$id:test" 2>&1); then
              if grep -q 'unknown_task' <<<"$out"; then
                echo "$project has no test task"
                continue
              fi
              echo "$out"
              exit 1
            fi
            # moon run drops runInCI:false tasks when CI is set, so CI is unset on this command only.
            if ! nix develop ".#$shell" --command env -u CI moon run "$id:test" --affected=false; then
              echo "::warning::$project is red on ${{ matrix.system }}; holding it"
              # Its packages and its images are held.
              jq -r --arg p "$project" '(.binaries[] | select(.project == $p) | .package),
                (.images[] | select(.project == $p) | .name)' \
                "$RUNNER_TEMP/plan.json" >> "$RUNNER_TEMP/held/${{ matrix.system }}"
            fi
          done
      - name: Build and check binaries
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SYSTEM: ${{ matrix.system }}
        run: |
          GOOS= GOARCH= go -C tools/cd build -o "$RUNNER_TEMP/cd" .
          mkdir -p "$RUNNER_TEMP/assets"
          jq -c '.binaries[] as $b | select(.build | index($b.package)) | $b' "$RUNNER_TEMP/plan.json" |
          while read -r b; do
            pkg=$(jq -r .package <<<"$b")
            # Not built on this leg: the artifact names other systems. This is not a hold.
            if [ "$(jq -r --arg s "$SYSTEM" 'if (.systems // []) | length == 0 then "yes" elif (.systems | index($s)) then "yes" else "no" end' <<<"$b")" = no ]; then continue; fi
            if grep -qx "$pkg" "$RUNNER_TEMP/held/$SYSTEM"; then continue; fi
            project=$(jq -r .project <<<"$b")
            version=$(jq -r .version <<<"$b")
            stage="$RUNNER_TEMP/stage/$pkg"
            mkdir -p "$stage/bin"
            kind=$(jq -r .kind <<<"$b")
            if [ "$kind" = nix ]; then
              # Nix-built: nix build .#<attr> in the project's flake. Its bin/ holds the binaries.
              nixOut=$(nix build --no-link --print-out-paths "./$project#$(jq -r .attr <<<"$b")")
              for name in $(jq -r '.binaries[]' <<<"$b"); do
                install -m 0755 "$nixOut/bin/$name" "$stage/bin/$name"
              done
            else
              for name in $(jq -r '.binaries[]' <<<"$b"); do
                go -C "$project" build -trimpath -o "$stage/bin/$name" .
              done
            fi
            # Every kind: a consumer runs the asset without this build's /nix/store.
            for name in $(jq -r '.binaries[]' <<<"$b"); do
              runtime=()
              while read -r soname; do runtime+=(-runtime "$soname"); done < <(jq -r '.runtimeDeps[]?' <<<"$b")
              "$RUNNER_TEMP/cd" check-asset -system "$SYSTEM" "${runtime[@]}" "$stage/bin/$name"
            done
            tar -C "$stage" -cf - bin | zstd -19 -q -o "$RUNNER_TEMP/assets/$pkg-$version-$SYSTEM.tar.zst"
          done
      - name: Find built assets
        id: built
        run: |
          if compgen -G "$RUNNER_TEMP/assets/*.tar.zst" > /dev/null; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest build provenance
        if: steps.built.outputs.any == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/assets/*.tar.zst
      - name: Upload assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: assets-${{ matrix.system }}
          path: |
            ${{ runner.temp }}/assets
            ${{ runner.temp }}/held
          if-no-files-found: ignore

  images:
    name: Images
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: plan
          path: ${{ runner.temp }}
      - name: Set up QEMU
        # arm64 builds run their final-stage RUN steps under emulation.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # The action defaults to tonistiigi/binfmt:latest, which runs privileged. Pin the
          # qemu-v10.2.3 index digest so the privileged image is fixed and reviewable.
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push and test images
        # A planned image is built once and pushed by digest, with no tag; the smoke
        # test runs on that exact digest. Any failed step holds the image, so the
        # manifest carries its previous digest. Tags are applied after the Release.
        env:
          SOURCE: ${{ github.sha }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -o pipefail
          plan="$RUNNER_TEMP/plan.json"
          # smoke runs an image's smoke test; an image with none passes. Commands are
          # chained with && because bash -e does not apply inside an if condition.
          smoke() {
            case "$1" in
              omp)
                # omp unpacks its native addon under HOME and loads it, so HOME must allow exec.
                local tmp=(--rm --user nonroot:nonroot --tmpfs /tmp:rw,exec,nosuid,nodev,uid=65532,gid=65532,mode=0700 --env HOME=/tmp)
                local home="$RUNNER_TEMP/omp-home"
                local bind=(--rm --user nonroot:nonroot --mount "type=bind,source=$home,target=/tmp" --env HOME=/tmp)
                docker run "${tmp[@]}" "$2" --version &&
                  docker run "${tmp[@]}" "$2" auth-broker --help &&
                  docker run "${tmp[@]}" "$2" auth-broker serve --help &&
                  docker run "${tmp[@]}" "$2" auth-gateway --help &&
                  docker run "${tmp[@]}" "$2" auth-gateway serve --help &&
                  mkdir -p "$home" && chmod 777 "$home" &&
                  docker run "${bind[@]}" "$2" auth-broker token > /dev/null &&
                  docker run "${bind[@]}" "$2" auth-gateway token > /dev/null &&
                  test -s "$home/.omp/auth-broker.token" &&
                  test -s "$home/.omp/auth-gateway.token"
                ;;
              autoscaler)
                # The image must report the fork version it was built with, not
                # just exit 0. An empty expectation fails, never passes.
                test -n "$3" && docker run --rm "$2" --version | grep -Fqx "autoscaler version $3"
                ;;
              headlamp)
                # The image must run and carry the tested commit as its frontend git
                # version. $SOURCE is the commit passed as the build arg. An empty or
                # "unknown" value fails: that is the Dockerfile default when the arg is
                # missing. --version prints only the Go constant, so the check reads the
                # frontend bundle the image serves.
                test -n "$SOURCE" && test "$SOURCE" != unknown &&
                  docker run --rm "$2" --version > /dev/null &&
                  docker run --rm --entrypoint /bin/sh "$2" -c "grep -rqsF -- '$SOURCE' /headlamp/frontend"
                ;;
            esac
          }
          mkdir -p "$RUNNER_TEMP/images/held"
          : > "$RUNNER_TEMP/images/held/images"
          : > "$RUNNER_TEMP/images/digests"
          jq -c '.buildImages as $b | .images[] | select(.name as $n | $b | index($n))' "$plan" | while read -r i; do
            name=$(jq -r .name <<<"$i")
            repo=$(jq -r .repository <<<"$i")
            project=$(jq -r .project <<<"$i")
            dockerfile=$(jq -r .dockerfile <<<"$i")
            platforms=$(jq -r '.platforms | join(",")' <<<"$i")
            # buildArgs may name {source} (the tested commit) or {tag} (this Release's
            # tag). The planner has already resolved {version}; both others are replaced here.
            mapfile -t build_args < <(jq -r --arg s "$SOURCE" --arg t "$TAG" \
              '(.buildArgs // {}) | to_entries[] | "--build-arg=\(.key)=\(.value | gsub("\\{source\\}"; $s) | gsub("\\{tag\\}"; $t))"' <<<"$i")
            # The fork version CI_COMMIT_TAG resolved to in the plan; empty if unset.
            expected=$(jq -r '.buildArgs.CI_COMMIT_TAG // empty' <<<"$i")
            rm -f "$RUNNER_TEMP/meta.json"
            if docker buildx build --platform "$platforms" --file "$project/$dockerfile" "${build_args[@]}" \
                --output "type=image,name=$repo,push-by-digest=true,name-canonical=true,push=true" \
                --metadata-file "$RUNNER_TEMP/meta.json" "$project" &&
              digest=$(jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/meta.json") &&
              docker pull "$repo@$digest" &&
              smoke "$name" "$repo@$digest" "$expected"; then
              echo "$name=$digest" >> "$RUNNER_TEMP/images/digests"
            else
              echo "::warning::image $name failed to build, push or pass its smoke test; holding it"
              echo "$name" >> "$RUNNER_TEMP/images/held/images"
            fi
          done
        shell: bash -e {0}
      - name: Upload image digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: images
          path: ${{ runner.temp }}/images

  # Builds the Cotal runtime from forks/cotal when the plan changed it or no runtime asset exists yet.
  # The steps match the old Cotal repo's rigel-release.yml. A failed build fails this job, and the
  # release job then publishes nothing.
  runtime:
    name: Cotal runtime (${{ matrix.platform }})
    needs: plan
    if: ${{ needs.plan.outputs.runtime == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: forks/cotal/package.json
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Native .node helpers are ABI-bound; match the downstream consumer's Node version.
          node-version: 24
          cache: pnpm
          cache-dependency-path: forks/cotal/pnpm-lock.yaml
      - name: Install Cotal dependencies
        working-directory: forks/cotal
        run: pnpm install --frozen-lockfile
      - name: Build Cotal
        working-directory: forks/cotal
        run: pnpm build
      - name: Check native glibc ceiling
        if: startsWith(matrix.platform, 'linux-')
        working-directory: forks/cotal
        run: node packages/seat/scripts/assert-native-ceiling.mjs
      - name: Assemble runtime archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          commit_time="$(git show -s --format=%ct HEAD)"
          asset_root="$RUNNER_TEMP/cotal-runtime-asset"
          mkdir -p "$asset_root/cotal"
          cd forks/cotal
          cp -R bin extensions implementations packages examples node_modules package.json pnpm-workspace.yaml "$asset_root/cotal/"
          cp -R bin "$asset_root/cotal/cotal-ai"
          ln -sfn ../../../cotal-ai "$asset_root/cotal/node_modules/.pnpm/node_modules/cotal-ai"
          tar_bin=tar
          if [ "$PLATFORM" = darwin-arm64 ]; then tar_bin=gtar; fi
          "$tar_bin" --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$commit_time" -czf "$RUNNER_TEMP/cotal-runtime-${PLATFORM}.tar.gz" -C "$asset_root" cotal
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/cotal-runtime-${{ matrix.platform }}.tar.gz
      - name: Upload runtime asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cotal-runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/cotal-runtime-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  tag-images:
    name: Tag images
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag every image digest with the release tag
        # New and carried digests alike: every image in the manifest gets this tag.
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -o pipefail
          jq -r '(.images // {}) | to_entries[] | "\(.value.repository) \(.value.digest)"' release-manifest.json |
          while read -r repo digest; do
            docker buildx imagetools create --tag "$repo:$TAG" "$repo@$digest"
          done
        shell: bash -e {0}

  release:
    name: Release
    needs: [plan, batch, images, runtime]
    # A skipped runtime job is not a failure: the previous runtime assets carry forward.
    # A failed runtime job still skips this job, so a broken runtime build publishes nothing.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.batch.result == 'success' && needs.images.result == 'success' && (needs.runtime.result == 'success' || needs.runtime.result == 'skipped') }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - name: Mint release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.NEBULA_RELEASE_APP_ID }}
          private-key: ${{ secrets.NEBULA_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - name: Download plan and assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: ${{ runner.temp }}/in
      - name: Copy unchanged assets from the previous Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          mkdir -p "$RUNNER_TEMP/previous"
          previous=$(jq -r '.previousTag // empty' "$RUNNER_TEMP/in/plan/plan.json")
          if [ -n "$previous" ]; then
            # A Release with no binary assets is an empty set, not an error.
            if [ "$(gh release view "$previous" --json assets --jq '[.assets[].name | select(endswith(".tar.zst"))] | length')" != 0 ]; then
              gh release download "$previous" --dir "$RUNNER_TEMP/previous" --pattern '*.tar.zst'
            fi
          fi
          # The Cotal runtime carries forward when this batch does not build it. Downloading here, before
          # the release commit and tag, means a failed download stops the run with nothing published.
          if [ -n "$previous" ] && ! compgen -G "$RUNNER_TEMP/in/cotal-runtime-*/cotal-runtime-*.tar.gz" > /dev/null; then
            mkdir -p "$RUNNER_TEMP/runtime-previous"
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern 'cotal-runtime-*' --dir "$RUNNER_TEMP/runtime-previous"
          fi
      - name: Publish release-manifest.json on main
        id: publish
        env:
          CGO_ENABLED: '0'
          TAG: ${{ needs.plan.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag=$TAG
          held=$(find "$RUNNER_TEMP/in" -path '*/held/*' -type f -exec cat {} + | sort -u | paste -sd, -)
          images=$(paste -sd, - < "$RUNNER_TEMP/in/images/digests")
          # A package held on any system keeps its previous assets everywhere, so
          # its newly built assets from the other systems stay out of the release set.
          jq -r --arg held "$held" '($held | split(",")) as $h | .binaries[]
            | select(.package as $p | $h | index($p) | not) | "\(.package)-\(.version)-"' \
            "$RUNNER_TEMP/in/plan/plan.json" > "$RUNNER_TEMP/released-prefixes"
          find "$RUNNER_TEMP/in" -name '*.tar.zst' | while read -r f; do
            name=$(basename "$f")
            while read -r prefix; do
              case "$name" in "$prefix"*) mv "$f" "$RUNNER_TEMP/assets/"; break ;; esac
            done < "$RUNNER_TEMP/released-prefixes"
          done
          git config user.name 'rigelbuild-nebula-release[bot]'
          git config user.email 'rigelbuild-nebula-release[bot]@users.noreply.github.com'
          go -C tools/cd build -o "$RUNNER_TEMP/cd" .
          commit=$("$RUNNER_TEMP/cd" publish -plan "$RUNNER_TEMP/in/plan/plan.json" -tag "$tag" \
            -assets "$RUNNER_TEMP/assets" -previous-assets "$RUNNER_TEMP/previous" -held "$held" -image "$images" \
            -base-url "https://github.com/$REPOSITORY/releases/download/" \
            -system x86_64-linux -system aarch64-linux -system aarch64-darwin)
          "$RUNNER_TEMP/cd" guard "$commit"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Tag the release commit
        env:
          TAG: ${{ steps.publish.outputs.tag }}
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: git push origin "$COMMIT:refs/tags/$TAG"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.publish.outputs.tag }}
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          git show "$COMMIT:release-manifest.json" > "$RUNNER_TEMP/release-manifest.json"
          # Only assets the manifest references are released, so held packages are not uploaded.
          mapfile -t files < <("$RUNNER_TEMP/cd" release-files -manifest "$RUNNER_TEMP/release-manifest.json" \
            -assets "$RUNNER_TEMP/assets" -sums "$RUNNER_TEMP/SHA256SUMS")
          held=$(jq -r '.held | join(", ")' "$RUNNER_TEMP/release-manifest.json")
          notes="Source: $(jq -r .source "$RUNNER_TEMP/release-manifest.json")"
          if [ -n "$held" ]; then notes="$notes"$'\n\n'"Held (previous asset kept): $held"; fi
          not_built=$(jq -r '.notBuilt | join(", ")' "$RUNNER_TEMP/in/plan/plan.json")
          if [ -n "$not_built" ]; then notes="$notes"$'\n\n'"Not built by CD (no build step for this toolchain): $not_built"; fi
          mkdir -p "$RUNNER_TEMP/runtime"
          if compgen -G "$RUNNER_TEMP/in/cotal-runtime-*/cotal-runtime-*.tar.gz" > /dev/null; then
            cp "$RUNNER_TEMP"/in/cotal-runtime-*/cotal-runtime-*.tar.gz "$RUNNER_TEMP/runtime/"
          elif compgen -G "$RUNNER_TEMP/runtime-previous/cotal-runtime-*.tar.gz" > /dev/null; then
            cp "$RUNNER_TEMP"/runtime-previous/cotal-runtime-*.tar.gz "$RUNNER_TEMP/runtime/"
          fi
          if compgen -G "$RUNNER_TEMP/runtime/cotal-runtime-*.tar.gz" > /dev/null; then
            (cd "$RUNNER_TEMP/runtime" && sha256sum cotal-runtime-*.tar.gz > cotal-runtime-SHA256SUMS)
          fi
          runtime_files=()
          if compgen -G "$RUNNER_TEMP/runtime/cotal-runtime-*.tar.gz" > /dev/null; then
            runtime_files=("$RUNNER_TEMP"/runtime/cotal-runtime-*.tar.gz "$RUNNER_TEMP/runtime/cotal-runtime-SHA256SUMS")
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes" \
            "$RUNNER_TEMP/release-manifest.json" "$RUNNER_TEMP/SHA256SUMS" "${files[@]}" "${runtime_files[@]}"

  sync-out:
    name: Sync out (jj-hooks, homebrew-tap)
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    environment: main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - name: Mint sync App token
        id: sync
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.NEBULA_SYNC_APP_ID }}
          private-key: ${{ secrets.NEBULA_SYNC_APP_PRIVATE_KEY }}
          owner: mattwilkinsonn
          repositories: jj-hooks
          permission-contents: write
      - name: Mirror jj-hooks
        id: mirror
        env:
          CGO_ENABLED: '0'
          MIRROR_TOKEN: ${{ steps.sync.outputs.token }}
        run: |
          # Fast-forwards the mirror to the tools/jj-hooks split. A mirror tip with
          # unrelated history is skipped with a warning (RIG-10830); the push never forces.
          go -C tools/cd build -o "$RUNNER_TEMP/cd" .
          "$RUNNER_TEMP/cd" mirror -repo . -prefix tools/jj-hooks \
            -url https://github.com/mattwilkinsonn/jj-hooks.git -branch main > "$RUNNER_TEMP/mirror.txt"
          cat "$RUNNER_TEMP/mirror.txt"
          echo "state=$(awk '{print $1}' "$RUNNER_TEMP/mirror.txt")" >> "$GITHUB_OUTPUT"
          echo "split=$(awk '{print $3}' "$RUNNER_TEMP/mirror.txt")" >> "$GITHUB_OUTPUT"
      - name: Copy jj-hooks Release assets to the mirror
        env:
          COMMIT: ${{ needs.release.outputs.commit }}
          NEBULA_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.sync.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
          SPLIT: ${{ steps.mirror.outputs.split }}
          STATE: ${{ steps.mirror.outputs.state }}
        run: |
          # Copies only when the mirror took the split. A skipped mirror has no
          # commit to target, so its Release is not created (RIG-10830).
          if [ "$STATE" = skipped ]; then
            echo "jj-hooks Release-asset copy skipped: the mirror was not updated (RIG-10830)"
            exit 0
          fi
          # Runs only when the manifest has per-system jj-hooks-bin assets (the Nix-built
          # jj-hooks package in tools/jj-hooks/component.cue).
          if ! git show "$COMMIT:release-manifest.json" | jq -e '(.["jj-hooks-bin"] // {}) | [.["x86_64-linux"], .["aarch64-linux"], .["aarch64-darwin"]] | any(type == "object")' >/dev/null; then
            echo "jj-hooks Release-asset copy skipped: no per-system jj-hooks assets in release-manifest.json"
            exit 0
          fi
          if gh release view "$TAG" --repo mattwilkinsonn/jj-hooks >/dev/null 2>&1; then
            echo "jj-hooks Release $TAG already exists; no copy"
            exit 0
          fi
          assets="$RUNNER_TEMP/jj-hooks-assets"
          mkdir -p "$assets"
          GH_TOKEN="$NEBULA_TOKEN" gh release download "$TAG" --repo RigelBuild/nebula --pattern 'jj-hooks-*' --dir "$assets"
          gh release create "$TAG" --repo mattwilkinsonn/jj-hooks --target "$SPLIT" \
            --title "$TAG" --notes "Copied from RigelBuild/nebula $TAG" "$assets"/*
      # Last, so a tap failure cannot block the mirror. The Release is already published
      # by the release job, which this step does not touch.
      - name: Mint tap token
        id: tap
        if: vars.AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: RigelBuild
          repositories: homebrew-tap
          permission-contents: write
      - name: Commit Homebrew formulae to homebrew-tap
        if: vars.AUTOMATION_APP_CLIENT_ID != ''
        env:
          CGO_ENABLED: '0'
          COMMIT: ${{ needs.release.outputs.commit }}
          RUN_NUMBER: ${{ github.run_number }}
          TAP_TOKEN: ${{ steps.tap.outputs.token }}
        run: |
          # Writes Formula/<tool>.rb from this Release's manifest; commits only on change.
          git show "$COMMIT:release-manifest.json" > "$RUNNER_TEMP/release-manifest.json"
          go -C tools/cd build -o "$RUNNER_TEMP/cd" .
          # The token reaches git as GIT_CONFIG_* env, never as a command argument.
          # printf is a shell builtin, so the token is not passed to an exec'd program.
          auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          tap="$RUNNER_TEMP/homebrew-tap"
          git init -q "$tap"
          git -C "$tap" remote add origin https://github.com/RigelBuild/homebrew-tap.git
          git -C "$tap" fetch -q --depth 1 origin main
          git -C "$tap" checkout -q -B main FETCH_HEAD
          "$RUNNER_TEMP/cd" formula -manifest "$RUNNER_TEMP/release-manifest.json" -out "$tap/Formula"
          git -C "$tap" add -A Formula
          if git -C "$tap" diff --cached --quiet; then
            echo "homebrew-tap formulae unchanged; no commit"
            exit 0
          fi
          git -C "$tap" config user.name 'rigelbuild-automation[bot]'
          git -C "$tap" config user.email 'rigelbuild-automation[bot]@users.noreply.github.com'
          git -C "$tap" commit -q -m "chore(formula): sync nebula ${RUN_NUMBER} formulae"
          git -C "$tap" push -q origin HEAD:refs/heads/main
      - name: Warn that homebrew-tap sync is skipped
        if: vars.AUTOMATION_APP_CLIENT_ID == ''
        run: |
          echo "::warning::homebrew-tap sync skipped: automation App credentials not configured (RIG-10833)"

  held:
    name: Held packages and images
    needs: [release, tag-images]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail the run when the release holds a package or image
        # A held package or image keeps its previous asset or digest, and the Release
        # still ships. This job makes that visible: the run goes red so the hold is seen.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$RUNNER_TEMP"
          held=$(jq -r '.held | join(" ")' "$RUNNER_TEMP/release-manifest.json")
          if [ -n "$held" ]; then
            echo "::error::held: ${held// /, }"
            exit 1
          fi
