# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: 'application'
language: 'go'
tags: ['go']

tasks:
  test:
    command: 'go'
    args: ['test', './...']
    env:
      CGO_ENABLED: '0'
    inputs: ['**/*.go', 'go.mod', 'go.sum', '**/testdata/**/*']
  nilaway:
    command: 'nilaway'
    args: ['-include-pkgs=github.com/RigelBuild/nebula/tools/rbuild-workspace-prune', '-test=false', './...']
    options:
      mergeArgs: 'replace'
