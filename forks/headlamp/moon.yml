# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Tasks run from this project's directory, which is the fork tree root.
layer: 'application'
language: 'go'
tasks:
  build:
    command: go
    args: ['-C', 'backend', 'build', '-trimpath', '-ldflags=-s -w', '-o', './headlamp-server', './cmd']
  test:
    command: go
    args: ['-C', 'backend', 'test', '-p', '1', './...']
    options:
      cache: false
