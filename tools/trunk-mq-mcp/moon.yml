language: typescript
tasks:
  install:
    command: bun install --frozen-lockfile
    inputs:
      - package.json
      - bun.lock
  typecheck:
    command: bun run typecheck
    deps:
      - install
    inputs:
      - src/**/*
      - test/**/*
      - bin/**/*
      - package.json
      - bun.lock
      - tsconfig.json
      - "/tools/tsconfig/base.json"
  test:
    command: bun test
    deps:
      - install
    inputs:
      - src/**/*
      - test/**/*
      - bin/**/*
      - package.json
      - bun.lock
      - tsconfig.json
      - "/tools/tsconfig/base.json"
  lint:
    command: bun run lint
    deps:
      - install
    inputs:
      - src/**/*
      - test/**/*
      - bin/**/*
      - biome.json
      - package.json
      - tsconfig.json
      - .gitignore
      - "/tools/tsconfig/base.json"
      - "/tools/biome-config/biome.json"
