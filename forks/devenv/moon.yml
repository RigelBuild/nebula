# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Tasks run from this project's directory, which is the fork tree root.
# Each task enters the fork's own devShell (forks/devenv/flake.nix
# devShells.default), which supplies the Nix C API .dev packages, boehmgc,
# and libclang that nix-bindings-bindgen-raw needs.
layer: 'application'
language: 'rust'
tasks:
  build:
    command: nix
    args: ['develop', '--command', 'cargo', 'build']
    options:
      runInCI: true
  test:
    command: nix
    args: ['develop', '--command', 'cargo', 'test']
    options:
      cache: false
      runInCI: true
